name: Glue distributable

# Phase 1 of the ouroboros-leios#1048 distributable: linking and relocation.
#
# The claim being tested is not "it builds" but "it starts on a machine whose
# glibc is older than the one it was built against". Measured: these binaries
# reference symbols up to GLIBC_2.38, while RHEL 8 has 2.28, RHEL 9 and Amazon
# Linux 2023 have 2.34, and Ubuntu 22.04 has 2.35. So glibc and its loader are
# bundled, and the container matrix below is the acceptance gate -- relying on
# the host's loader would fail every one of those.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and relocate (x86_64-linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            allow-import-from-derivation = true

      - name: Check nix formatting
        run: nix run nixpkgs#alejandra -- --check flake.nix flake nix perSystem

      # Result symlinks go to /tmp, never into the checkout: an untracked
      # `result` makes the flake's git tree dirty.
      - name: Build the relocatable payload
        run: nix build .#glue-relocatable --print-build-logs -o /tmp/reloc

      - name: Verify the relocation is complete
        run: |
          set -euo pipefail
          cp -RL /tmp/reloc /tmp/tree
          chmod -R u+w /tmp/tree

          echo "--- bundled libraries ---"
          ls /tmp/tree/lib
          echo "loader: $(cat /tmp/tree/share/loader)"

          # glibc must be among them; without it the whole approach collapses
          # back to depending on the host's C library.
          test -e "/tmp/tree/lib/libc.so.6"
          test -e "/tmp/tree/lib/$(cat /tmp/tree/share/loader)"

          echo "--- interpreter patch table ---"
          cat /tmp/tree/share/interp.offsets

          # RPATH must be $ORIGIN-relative, or the tree only works where built.
          for b in /tmp/tree/bin/*; do
            nix run nixpkgs#patchelf -- --print-interpreter "$b" >/dev/null 2>&1 || continue
            rpath=$(nix run nixpkgs#patchelf -- --print-rpath "$b")
            echo "$(basename "$b"): rpath=$rpath"
            # shellcheck disable=SC2016  # $ORIGIN is a literal, not a variable
            case "$rpath" in
              '$ORIGIN/../lib') ;;
              *) echo "::error::$(basename "$b") has a non-relative rpath: $rpath"; exit 1 ;;
            esac
          done

          # Nothing under lib/ may still name the store.
          if grep -rIl "/nix/store" /tmp/tree/bin /tmp/tree/lib 2>/dev/null | grep .; then
            echo "::error::store paths remain in the relocated tree"
            exit 1
          fi

      - name: Build the single-file artifact
        run: |
          set -euo pipefail
          nix build .#glue --print-build-logs -o /tmp/glue-exe
          cp -L /tmp/glue-exe /tmp/glue
          chmod +x /tmp/glue
          echo "artifact: $(stat -c%s /tmp/glue | numfmt --to=iec)"
          sha256sum /tmp/glue | tee /tmp/glue.sha256

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: glue-x86_64-linux
          path: |
            /tmp/glue
            /tmp/glue.sha256
          retention-days: 14

  # The acceptance gate. Each of these has a glibc older than the 2.38 the
  # binaries reference, so all three would fail if we used the host's loader.
  # `beacon --help` starting is the whole assertion; running a benchmark needs
  # offline analyzer resolution, which is phase 2.
  old-distros:
    name: Runs on ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8        # glibc 2.28
          - image: amazonlinux:2023    # glibc 2.34
          - image: ubuntu:22.04        # glibc 2.35
          - image: debian:12           # glibc 2.36

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glue-x86_64-linux
          path: /tmp/artifact

      - name: Start it under ${{ matrix.image }}
        run: |
          set -euo pipefail
          chmod +x /tmp/artifact/glue
          docker run --rm \
            -v /tmp/artifact:/artifact:ro \
            -e GLUE_HOME=/tmp/glue-home \
            ${{ matrix.image }} \
            sh -eux -c '
              (ldd --version 2>&1 || true) | head -1

              # Some minimal container images ship neither tar nor gzip.
              # amazonlinux:2023 is one, although the EC2 AMI has both. Install
              # them here so this job tests the artifact rather than the package
              # list of the image.
              if ! command -v tar >/dev/null 2>&1 || ! command -v gzip >/dev/null 2>&1; then
                (dnf install -y -q tar gzip || yum install -y -q tar gzip \
                  || (apt-get update -qq && apt-get install -y -qq tar gzip) \
                  || apk add --no-cache tar gzip) >/dev/null 2>&1
              fi

              cp /artifact/glue /tmp/glue
              chmod +x /tmp/glue
              /tmp/glue --help > /tmp/out 2>&1 || { cat /tmp/out; exit 1; }
              head -5 /tmp/out
              # Second run must reuse the unpacked tree rather than redo it.
              /tmp/glue --help > /dev/null 2>&1
              test -f /tmp/glue-home/*/.complete
            '
