name: Glue distributable

# Builds the SPO-facing distributable of ouroboros-leios#1048 and smoke-tests
# it. Separate from ci.yml because that one is a cabal build of beacon for
# development; this one is nix, and its subject is the artifact we hand to
# people outside the team.
#
# The point of running this on Linux is that the maintainers work on darwin
# while both *required* target platforms are Linux. Without CI, the Linux
# payload is only ever built by whoever remembers to.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  payload:
    name: Payload (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            # ouroboros-consensus's flake declares x86_64-linux, so
            # db-analyser substitutes from cache.iog.io here.
            payload: true
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            # ouroboros-consensus's flake does NOT declare aarch64-linux
            # (it is commented out in its supportedSystems), so there is no
            # db-analyser to consume and none in the cache. The payload is
            # expected to be unavailable until that is resolved -- tracked in
            # ouroboros-leios#1048. beacon itself still builds and is worth
            # guarding against regressions.
            payload: false

    steps:
      - uses: actions/checkout@v4

      # The nix store plus a db-analyser closure does not comfortably fit
      # alongside everything GitHub preinstalls.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            allow-import-from-derivation = true

      - name: Check nix formatting
        run: nix run nixpkgs#alejandra -- --check flake.nix flake nix perSystem

      - name: Build beacon
        run: nix build .#beacon --no-link --print-build-logs

      # Guards the `plots = false` flavour of Cardano.Beacon.Plot, which the
      # payload uses and which nothing else compiles. Without this it would
      # rot unnoticed, since the default flag value is True.
      # Result symlinks go to /tmp, never into the checkout: an untracked
      # `result` in the repo makes the git tree dirty, which nix records in
      # the payload's own provenance as a dirty source revision.
      - name: Build payload
        if: matrix.payload
        run: nix build .#glue-payload --print-build-logs -o /tmp/glue-payload

      - name: Smoke-test payload
        if: matrix.payload
        run: |
          set -euo pipefail
          test -x /tmp/glue-payload/bin/beacon
          test -x /tmp/glue-payload/bin/db-analyser
          test -x /tmp/glue-payload/bin/jq
          test -x /tmp/glue-payload/bin/time
          for f in provenance capabilities chain-manifest plan; do
            test -s "/tmp/glue-payload/share/$f.json"
          done

          echo "--- provenance ---"
          cat /tmp/glue-payload/share/provenance.json

          # A payload build must never report itself as built from a dirty
          # tree: its commit lands in every report an SPO sends back.
          if grep -q '"dirty"\|-dirty' /tmp/glue-payload/share/provenance.json; then
            echo "::error::payload provenance records a dirty source tree"
            exit 1
          fi

          # The plots flag must actually be off, or the distributable carries
          # cairo and the X11 client libraries for no reason.
          if ldd /tmp/glue-payload/bin/beacon | grep -qiE "libcairo|libX11"; then
            echo "::error::payload beacon is linked against cairo/X11"
            exit 1
          fi

      # Proves the payload resolves db-analyser and its commit metadata from
      # baked provenance instead of `nix build` + the GitHub API. Runs with a
      # PATH that has no nix on it, which is the whole claim.
      - name: Verify offline analyzer resolution
        if: matrix.payload
        run: |
          set -euo pipefail
          sha=$(nix run nixpkgs#jq -- -r .analyzer.ciCommitSHA1 /tmp/glue-payload/share/provenance.json)
          mkdir -p /tmp/beacon-data

          # No --rev: a build that bundles db-analyser already knows which one.
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            /tmp/glue-payload/bin/beacon --data-dir /tmp/beacon-data build \
            | tee /tmp/default.log
          grep -q "$sha" /tmp/default.log
          grep -q "using bundled binary" /tmp/default.log

          # An explicit, matching --rev must keep working.
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            /tmp/glue-payload/bin/beacon --data-dir /tmp/beacon-data build --rev "$sha" \
            | tee /tmp/build.log
          grep -q "using db-analyser pinned in this build" /tmp/build.log
          grep -q "using bundled binary" /tmp/build.log

      # A payload pinned to one db-analyser must refuse a different --rev
      # rather than silently benchmark the one it has under the wrong label.
      - name: Verify mismatched --rev/--ghc are refused
        if: matrix.payload
        run: |
          set -euo pipefail
          if env -i PATH=/usr/bin:/bin HOME=/tmp \
               /tmp/glue-payload/bin/beacon --data-dir /tmp/beacon-data build --rev deadbeef1 \
               > /tmp/mismatch.log 2>&1; then
            echo "::error::payload accepted a --rev it cannot honour"
            cat /tmp/mismatch.log
            exit 1
          fi
          grep -q "pinned db-analyser" /tmp/mismatch.log

          # Same for a compiler this build's db-analyser was not built with.
          if env -i PATH=/usr/bin:/bin HOME=/tmp \
               /tmp/glue-payload/bin/beacon --data-dir /tmp/beacon-data build --ghc haskell914 \
               > /tmp/ghc.log 2>&1; then
            echo "::error::payload accepted a --ghc it cannot honour"
            cat /tmp/ghc.log
            exit 1
          fi
          grep -q "was compiled with" /tmp/ghc.log

      - name: Report payload size
        if: matrix.payload
        run: |
          echo "closure: $(nix path-info -Sh .#glue-payload | awk '{print $NF}')"
          ls -lh /tmp/glue-payload/bin/

      # Not `continue-on-error` on the whole job: this step is expected to
      # fail today and its failure is information, not noise. When
      # aarch64-linux gains a db-analyser this starts passing and the matrix
      # entry above should flip to `payload: true`.
      - name: Payload availability (known gap)
        if: ${{ !matrix.payload }}
        continue-on-error: true
        run: |
          echo "aarch64-linux has no db-analyser upstream yet; see ouroboros-leios#1048"
          nix build .#glue-payload --no-link --print-build-logs

  # The Linux answer to relocation: a musl-linked payload with no interpreter
  # and no shared libraries, so moving it to an SPO's machine is a copy.
  #
  # Nothing here is cached -- consensus's CI cross-compiles only to ucrt64, so
  # cache.iog.io has no musl db-analyser and this builds consensus and its whole
  # dependency tree from source. Hence its own job, and continue-on-error until
  # it is reliable: it must not gate ordinary PRs while being iterated on.
  #
  # TODO: add a binary cache (cachix) so this cost is paid once rather than per
  # run, then drop continue-on-error and fold it into the matrix above.
  static:
    name: Static musl payload (x86_64-linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            allow-import-from-derivation = true

      # Evaluation is fast and fails fast. Separating it means a wrong
      # attribute path is reported in seconds instead of after a long build.
      - name: Evaluate static payload
        run: nix eval --raw .#glue-payload-static.drvPath

      - name: Build static payload
        run: nix build .#glue-payload-static --print-build-logs -o /tmp/glue-static

      # The whole point: no interpreter, no shared libraries, no store paths.
      # Asserted rather than assumed, because haskell.nix producing genuinely
      # static executables from projectCross.musl64 is exactly the thing that
      # could quietly not be true.
      - name: Verify the binaries are actually static
        run: |
          set -euo pipefail
          for b in beacon db-analyser jq time; do
            f=/tmp/glue-static/bin/$b
            echo "--- $b ---"
            file -L "$f"
            if ldd "$f" 2>&1 | grep -qv "not a dynamic executable"; then
              echo "::error::$b is dynamically linked"
              ldd "$f" || true
              exit 1
            fi
          done

      # Cross-compiled here because consensus's flake does not declare
      # aarch64-linux; see perSystem/glue.nix. Built in this job and smoke-
      # tested in `static-aarch64`, since a cross-built binary that has never
      # been executed on the target is not evidence of anything.
      - name: Build aarch64-linux artifact (cross)
        run: nix build .#glue-aarch64-linux --print-build-logs -o /tmp/glue-aarch64

      - name: Upload aarch64-linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: glue-aarch64-linux
          path: /tmp/glue-aarch64
          retention-days: 7

      - name: Verify it runs after being copied out of the store
        run: |
          set -euo pipefail
          cp -RL /tmp/glue-static /tmp/moved
          chmod -R u+w /tmp/moved
          if grep -rIl "/nix/store" /tmp/moved/bin 2>/dev/null | grep .; then
            echo "::error::store paths remain in the copied payload"
            exit 1
          fi
          mkdir -p /tmp/static-data
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            /tmp/moved/bin/beacon --data-dir /tmp/static-data build | tee /tmp/static.log
          grep -q "using bundled binary" /tmp/static.log

  # The cross-built aarch64 artifact, executed on actual aarch64 hardware.
  static-aarch64:
    name: Static musl payload, run on aarch64
    runs-on: ubuntu-24.04-arm
    needs: static
    continue-on-error: true

    steps:
      - name: Download the cross-built artifact
        uses: actions/download-artifact@v4
        with:
          name: glue-aarch64-linux
          path: /tmp/artifact

      - name: Verify it is an aarch64 static binary
        run: |
          set -euo pipefail
          chmod +x /tmp/artifact/glue-aarch64
          # The artifact is a shell header with a tar appended, so `file` on it
          # says "shell script"; unpack first and inspect what is inside.
          mkdir -p /tmp/unpacked
          GLUE_HOME=/tmp/unpacked /tmp/artifact/glue-aarch64 --help >/dev/null 2>&1 || true
          bin=$(find /tmp/unpacked -name beacon -type f | head -1)
          test -n "$bin"
          file "$bin"
          file "$bin" | grep -q "ARM aarch64"
          file "$bin" | grep -q "statically linked"

      # The point of the whole job: a binary cross-compiled on x86_64 actually
      # starting on aarch64 hardware.
      - name: Run it
        run: |
          set -euo pipefail
          mkdir -p /tmp/data/chain
          echo '{}' > /tmp/data/chain/chain-register.json
          GLUE_HOME=/tmp/unpacked /tmp/artifact/glue-aarch64 \
            --data-dir /tmp/data list-chains | tee /tmp/arm.log
          grep -qi "registered chain" /tmp/arm.log
